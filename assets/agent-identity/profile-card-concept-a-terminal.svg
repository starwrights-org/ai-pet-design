      <rect x="12" y="6" width="8" height="14" fill="#00FF9C"/>
      <rect x="24" y="0" width="8" height="20" fill="#334455" opacity="0.6"/>
      <rect x="36" y="4" width="8" height="16" fill="#00FF9C"/>
      <rect x="48" y="0" width="8" height="20" fill="#00FF9C"/>
      <rect x="60" y="8" width="8" height="12" fill="#334455" opacity="0.6"/>
      <rect x="72" y="0" width="8" height="20" fill="#00FF9C"/>
      <rect x="84" y="2" width="8" height="18" fill="#00FF9C"/>
      <rect x="96" y="0" width="8" height="20" fill="#00FF9C"/>
      <rect x="108" y="6" width="8" height="14" fill="#334455" opacity="0.6"/>
      <rect x="120" y="0" width="8" height="20" fill="#00FF9C"/>
