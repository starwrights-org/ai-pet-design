<svg xmlns="http://www.w3.org/2000/svg" width="440" height="620" viewBox="0 0 440 620">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E14"/>
      <stop offset="100%" stop-color="#0D1420"/>
    </linearGradient>
    <linearGradient id="glowA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF9C"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <filter id="softGlowA" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridA" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 0 H24 V24" fill="none" stroke="#1A2432" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="440" height="620" fill="#05070B"/>
  <rect x="16" y="16" width="408" height="588" rx="18" fill="url(#bgA)" stroke="#1E2A38" stroke-width="1.5"/>
  <rect x="16" y="16" width="408" height="588" rx="18" fill="url(#gridA)" opacity="0.5"/>
  <rect x="16" y="16" width="408" height="588" rx="18" fill="none" stroke="url(#glowA)" stroke-width="1" opacity="0.5"/>

  <!-- Header -->
  <text x="40" y="52" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#00D9FF" letter-spacing="2">AGENT_ECONOMY // PROFILE</text>
