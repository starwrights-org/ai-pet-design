    <rect x="0" y="0" width="100" height="100" rx="14" fill="#0F1A26" stroke="url(#glowA)" stroke-width="2" filter="url(#softGlowA)"/>
    <path d="M20 70 L35 40 L50 60 L65 30 L80 70" fill="none" stroke="#00D9FF" stroke-width="2" opacity="0.8"/>
    <circle cx="50" cy="35" r="10" fill="none" stroke="#00FF9C" stroke-width="2"/>
    <circle cx="50" cy="35" r="3" fill="#00FF9C"/>
