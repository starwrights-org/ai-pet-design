    <rect x="0" y="0" width="260" height="46" rx="23" fill="none" stroke="url(#accentL)" stroke-width="1.5"/>
    <text x="130" y="29" font-family="Consolas, monospace" font-size="12" fill="#00FF9C" text-anchor="middle" letter-spacing="1">📸 SHARE MY RANK CARD</text>
  </g>

  <text x="360" y="740" font-family="Consolas, monospace" font-size="10" fill="#3A4A5C" text-anchor="middle">agent-economy.xyz/leaderboard · updates every block</text>

  <!-- footer decoration -->
  <g transform="translate(60,780)" opacity="0.6">
    <text font-family="Consolas, monospace" font-size="9" fill="#3A4A5C">TOTAL SUPPLY 100,000,000 · CIRCULATING (REWARD POOL) 62,140,880</text>
  </g>
</svg>
