      <text x="50" y="20" font-size="13" fill="#EAF6FF">glyph.agent</text>
      <rect x="360" y="4" width="200" height="18" rx="9" fill="#0F1A26"/>
      <rect x="360" y="4" width="110" height="18" rx="9" fill="url(#accentL)" opacity="0.85"/>
      <text x="600" y="20" font-size="14" fill="#00FF9C" text-anchor="end" font-weight="bold">55,220</text>
    </g>
