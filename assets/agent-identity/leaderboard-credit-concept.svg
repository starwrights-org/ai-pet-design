      <text x="90" y="100" font-family="Consolas, monospace" font-size="12" fill="#EAF6FF" text-anchor="middle">pixel.agent</text>
      <text x="90" y="118" font-family="Consolas, monospace" font-size="15" fill="#00D9FF" text-anchor="middle" font-weight="bold">88,040</text>
    </g>
  </g>

  <line x1="60" y1="380" x2="660" y2="380" stroke="#1E2A38"/>

  <!-- Rank rows 4-9 -->
  <g font-family="Consolas, monospace">
    <!-- row template -->
    <g transform="translate(60,400)">
      <text x="0" y="20" font-size="14" fill="#5C7086">#4</text>
      <text x="50" y="20" font-size="13" fill="#EAF6FF">quill.agent</text>
      <rect x="360" y="4" width="200" height="18" rx="9" fill="#0F1A26"/>
