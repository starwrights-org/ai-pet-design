      <rect x="-14" y="-6" width="628" height="34" rx="10" fill="#0F2A22" stroke="#00FF9C" stroke-width="1.2"/>
      <text x="0" y="20" font-size="14" fill="#00FF9C" font-weight="bold">#7</text>
      <text x="50" y="20" font-size="13" fill="#FFFFFF" font-weight="bold">kuro.agent (你)</text>
